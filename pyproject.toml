[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-training-data-factory"
version = "1.0.0"
description = "Production-grade data pipeline for building AI training datasets"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AI Training Data Factory Team"}
]
keywords = [
    "ai", "machine-learning", "data-pipeline", "nlp", "llm",
    "dataset", "web-scraping", "deduplication", "data-quality"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
full = [
    "scrapy>=2.11.0",
    "selenium>=4.15.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "spacy>=3.7.0",
    "langdetect>=1.0.9",
    "sentence-transformers>=2.2.0",
    "transformers>=4.35.0",
    "datasketch>=1.6.0",
    "faiss-cpu>=1.7.4",
    "detoxify>=0.5.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "datasets>=2.14.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
data-factory = "ai_training_data_factory.cli:cli"

[project.urls]
Homepage = "https://github.com/ai-training-data-factory"
Documentation = "https://github.com/ai-training-data-factory/docs"
Repository = "https://github.com/ai-training-data-factory"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_training_data_factory*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=ai_training_data_factory --cov-report=term-missing"
